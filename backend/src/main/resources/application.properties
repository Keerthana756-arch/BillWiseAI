server.port=${PORT:8080}

# Database Configuration (Auto-detects MySQL or PostgreSQL in Cloud or Local)
spring.datasource.url=${DB_URL:${DATABASE_URL:jdbc:mysql://localhost:3306/billwiseai?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# File Upload Configuration
spring.servlet.multipart.max-file-size=15MB
spring.servlet.multipart.max-request-size=15MB
file.upload-dir=uploads

# JWT Security Configuration
jwt.secret=${JWT_SECRET:BillWiseAISecretKeyForJwtAuthenticationMustBeAtLeast256BitsLongForHMACSHA256}
jwt.expiration=86400000

# AI Configuration (Optional Gemini API key, falls back to built-in smart AI engine)
gemini.api.key=${GEMINI_API_KEY:}
gemini.api.url=https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent
