version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: billwiseai-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: billwiseai
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: billwiseai-app
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      DB_URL: jdbc:mysql://mysql:3306/billwiseai?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      DB_USERNAME: root
      DB_PASSWORD: root
      JWT_SECRET: BillWiseAISecretKeyForJwtAuthenticationMustBeAtLeast256BitsLongForHMACSHA256
      GEMINI_API_KEY: ""
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  mysql_data:
