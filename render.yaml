databases:
  - name: billwiseai-db
    databaseName: billwiseai
    user: billwiseai
    plan: free
    region: oregon

services:
  - type: web
    name: billwiseai
    env: docker
    dockerfilePath: Dockerfile
    plan: free
    region: oregon
    healthCheckPath: /api/health
    envVars:
      - key: PORT
        value: 8080
      - key: DB_URL
        fromDatabase:
          name: billwiseai-db
          property: connectionString
      - key: DATABASE_URL
        fromDatabase:
          name: billwiseai-db
          property: connectionString
      - key: DB_USERNAME
        fromDatabase:
          name: billwiseai-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: billwiseai-db
          property: password
      - key: JWT_SECRET
        generateValue: true
      - key: GEMINI_API_KEY
        sync: false
